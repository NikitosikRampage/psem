# Селекторы страниц Profi.ru.
#
# ВАЖНО: разметка Profi.ru закрыта авторизацией и периодически меняется, поэтому
# значения ниже — стартовые предположения. Перед реальной работой:
#   1. Откройте ленту заказов в своём Chrome, нажмите F12 → Elements;
#   2. Найдите элемент карточки заказа и поправьте селекторы;
#   3. Запустите бота в режиме dry_run (включён по умолчанию) и проверьте в «Логах»,
#      что заказы распознаются и форма заполняется.
# Можно перечислять несколько вариантов через запятую — сработает первый найденный.
# Селекторы list.* — обычный CSS (ищутся внутри карточки заказа через querySelector).
# В order_page.* можно использовать и расширения Playwright: :has-text('…'), :text('…').
# Пустая строка — элемент не используется.

# Одна или несколько лент заказов (например, отдельная ссылка на каждую категорию).
orders_urls:
  - "https://profi.ru/backoffice/n.php"

# Проверено по снимку кабинета от 26.09.2026.
list:
  wait_for: "a[data-testid$='_order-snippet']"
  card: "a[data-testid$='_order-snippet']"
  link: ""                 # карточка сама является ссылкой <a>
  id_attr: "id"            # <a id="94048501" ...>
  title: "h3"
  description: "p"
  budget: "span[aria-hidden='true']"      # «800 ₽», «до 1400 ₽»; пусто — бюджет не указан
  geo: "ul[role='list']"                  # «Дистанционно · Москва»
  category: ""             # в ленте категории нет — фильтр категорий сравнивает с заголовком
  client_name: ""
  client_name_line: -2     # имя клиента — предпоследняя строка карточки (последняя — время)
  client_type: ""
  scroll_times: 3          # сколько раз прокрутить ленту для подгрузки

order_page:
  # Отдельной кнопки «Откликнуться» нет: сразу блок «Выберите тариф» → «Продолжить».
  # ВНИМАНИЕ: не используйте общий поиск по тексту «Откликнуться» — он находит карточки
  # «Похожих заказов» внизу страницы.
  respond_button: ""
  form: ""
  already_responded: ""    # TODO: текст/блок на заказе, где отклик уже есть
  client_name: ""
  type_paid: "[data-testid='orderCard/tariffs'] div[bordercolor]:has(span:text-is('Отклик'))"
  type_commission: "[data-testid='orderCard/tariffs'] div[bordercolor]:has(span:text-is('Комиссия'))"
  default_type: "paid"
  paid_cost: "[data-testid='orderCard/tariffs'] div[bordercolor]:has(span:text-is('Отклик')) span[color]"
  commission_cost: "[data-testid='orderCard/tariffs'] div[bordercolor]:has(span:text-is('Комиссия')) span[color]"
  # Кнопка после выбора тарифа. В тестовом режиме (dry run) бот её НЕ нажимает.
  continue_button: "[data-testid='orderCard/tariffs'] div:text-is('Продолжить')"
  # TODO: шаг после «Продолжить» ещё не снят — поля ниже пока предположения.
  commission_percent_input: ""
  message_input: "textarea"
  price_input: ""
  price_max_input: ""
  price_from_checkbox: ""
  submit_button: ""
  success: ""

behavior:
  typing_delay_ms: 25      # задержка между символами при вводе текста (0 — вставить сразу)
  navigation_timeout_ms: 30000
  element_timeout_ms: 8000

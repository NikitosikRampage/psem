# Пример настроек. При первом запуске создаётся config/settings.yaml (он в .gitignore,
# т.к. может содержать токен Telegram). Все параметры редактируются и из интерфейса.

browser:
  cdp_url: http://127.0.0.1:9222   # Chrome, запущенный с --remote-debugging-port=9222
  poll_interval_sec: 60            # как часто перечитывать ленту заказов
  dry_run: true                    # true — заполнять форму, но НЕ отправлять (для проверки селекторов)

filters:
  categories: []                   # подстроки заголовка заказа, напр. ["Физика", "ЕГЭ"]; пусто — любые
  keywords_include: []             # нужно хотя бы одно слово в названии/описании
  keywords_exclude: []             # стоп-слова, напр. ["онлайн-школ", "в команду", "ставка"]
  remote_mode: remote_only         # remote_only — только дистанционные; any — любые; offline_only — только очные
  max_updated_minutes: 0           # обновлён не больше N минут назад (время из ленты); 0 — не важно
  max_created_minutes: 0           # создан не больше N минут назад («Заказ оставлен…»); 0 — не важно
  # Заказы от организаций (школы, центры, ООО, ИП…) пропускаются всегда — по имени клиента.

templates:
  rotation: round_robin            # round_robin | random
  my_name: "Никита"                # {my_name}
  deadline: "3 дня"                # {deadline}
  items:                           # переменные: {name} {my_name} {price} {deadline} {title} {category} {budget}
    - name: Базовый
      enabled: true
      text: "Здравствуйте, {name}! Готов взяться за «{title}». Стоимость: {price} ₽, срок: {deadline}. {my_name}"
    - name: Короткий
      enabled: true
      text: "Добрый день! Выполню «{title}» за {deadline}, цена {price} ₽. Есть опыт и отзывы."

pricing:                           # моя цена в поле «Цена» по бюджету клиента
  rules:                           # первая подходящая строка; budget_max пусто/0 — без верхней границы
    - {budget_min: 0, budget_max: 1000, price: 1000}
    - {budget_min: 1000, budget_max: 1500, price: 1300}
    - {budget_min: 1500, budget_max: 4000, price: 1500}
  take_no_budget: true             # брать заказы, где клиент не указал бюджет
  no_budget_price: 1200            # и вписывать эту цену

response:
  priority: [commission, paid]     # порядок выбора типа отклика
  allow_paid: true                 # обычный (платный) отклик
  allow_commission: true           # отклик за комиссию
  max_commission: 0                # ₽; не откликаться за комиссию дороже (0 — без ограничения)
  paid_cost_min: 0                 # ₽; платно откликаться, только если отклик стоит от…
  paid_cost_max: 0                 # …до (0 — без ограничения); цена читается на странице заказа
  paid_cost_estimate: 100          # ₽, если стоимость отклика не прочиталась со страницы

timing:
  delay_before: {min: 5, max: 20, unit: sec}       # от открытия заказа до нажатия на тариф («Комиссия»)
  tariff_to_send: {min: 15, max: 45, unit: sec}    # от нажатия на тариф до «Отправить сообщение»
  interval_between: {min: 1, max: 3, unit: min}   # пауза после каждого отклика
  work_hours:
    enabled: true
    start: "09:00"
    end: "21:00"
    days: [1, 2, 3, 4, 5, 6, 7]    # 1 — понедельник … 7 — воскресенье

limits:                            # 0 — без ограничения
  per_day: 30
  per_hour: 6
  paid_per_day: 10
  budget_per_day: 1000             # ₽ на платные отклики в день
  on_limit: stop                   # stop — автостоп; pause — ждать освобождения лимита

telegram:
  enabled: false
  token: ""                        # токен от @BotFather
  chat_id: ""                      # ваш chat id (можно узнать у @userinfobot)

storage:
  db_path: data/profi_bot.db
  log_path: data/profi_bot.log
  export_dir: exports
  debug_dir: data/debug            # снимки непонятных страниц заказа (для разбора)
